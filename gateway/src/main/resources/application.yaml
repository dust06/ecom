server:
  port: 9090

spring:
  application:
    name: gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceBreaker
                fallbackUri: forward:/fallback/auth

app:
  jwt-secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
  jwt-expiry: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/